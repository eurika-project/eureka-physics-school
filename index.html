<body>
<div class="app" id="app"></div>
<script>const COURSE_ROWS = [
['Физика — наука о природе','Наблюдаем мир вокруг: физические явления, опыт и научное объяснение.','🔍','#8357d5',[
['Физика — наука о природе','Физика изучает явления природы, свойства тел и изменения, которые происходят с телами.','Наблюдение помогает заметить явление, а измерение — описать его количественно. Физические знания получают и проверяют с помощью опыта. Вещество образует тела; физическое явление — изменение состояния или взаимодействие тел.','Тело — отдельный предмет; вещество — то, из чего состоят тела; физическое явление — изменение или взаимодействие, которое можно наблюдать.','Примеры: движение, нагревание, испарение, электризация, распространение света и звука.','Какое из перечисленного является физическим явлением?',['Движение автомобиля','Медь','Стеклянный стакан'],0,'Движение — изменение положения тела, то есть физическое явление.','Вспомни: здесь названо тело, вещество или происходящее изменение?'],
['Научные методы изучения природы','Учёные задают вопросы о природе и проверяют объяснения наблюдениями и опытами.','Наблюдение проводят без намеренного изменения условий; эксперимент — при специально созданных и контролируемых условиях. Измерение сопоставляет величину с единицей. Научная модель помогает изучать объект, если сам объект недоступен или слишком сложен. Результаты записывают, сравнивают и делают вывод.','Наблюдение, эксперимент, измерение и моделирование — основные способы исследования природы. Вывод должен опираться на полученные данные.','Пример исследования: вопрос → предположение → план опыта → измерения → сравнение результатов → вывод.','Чем эксперимент отличается от простого наблюдения?',['Условия специально изменяют и контролируют','Ничего не измеряют','Результат заранее известен'],0,'В эксперименте исследователь намеренно меняет условия и наблюдает результат.','Ищи вариант, где условия опыта активно организует исследователь.']
]],
['Физические величины и измерения','Научимся описывать свойства тел числами и единицами измерения.','🧭','#3976dc',[
['Международная система единиц (СИ)','Чтобы сравнивать измерения, физики используют согласованную систему единиц.','Физическая величина описывает измеримое свойство тела или явления. Значение величины состоит из числа и единицы. В СИ основные единицы: метр (м), килограмм (кг), секунда (с), ампер (А), кельвин (К), моль (моль), кандела (кд). Производные единицы строят из основных: например, скорость — м/с.','Число без единицы обычно не задаёт измеренную величину полностью. При вычислениях единицы должны быть согласованы.','Перевод: 1 км = 1000 м; 1 ч = 3600 с; 1 г = 0,001 кг.','Какая единица является основной единицей длины в СИ?',['Метр','Километр в час','Ньютон'],0,'Основная единица длины в СИ — метр.','Вспомни базовую единицу, а не кратную или производную.']
]],
['Физические величины и измерения','Величины бывают числовыми и направленными; запись измерений требует аккуратности.','🧮','#3976dc',[
['Скалярные и векторные физические величины','Для некоторых величин достаточно числа, а для других необходимо ещё направление.','Скалярная величина задаётся числовым значением и единицей (масса, время, температура, путь). Векторная величина имеет модуль, направление и единицу (перемещение, скорость, сила). Направления векторов складывают с учётом их ориентации.','Путь — скаляр; перемещение и сила — векторы. Модуль вектора неотрицателен.','На одной прямой сонаправленные векторы складывают, противоположно направленные — вычитают по модулю.','Какая величина является векторной?',['Масса','Время','Сила'],2,'Сила задаётся величиной и направлением, поэтому это вектор.','Спроси себя: влияет ли направление на описание этой величины?']
]],
['Физические величины и измерения','Разберём точность записи и удобные способы представления очень больших и малых чисел.','📏','#3976dc',[
['Точность измерений и вычислений. Запись больших и малых чисел','Любое измерение имеет ограниченную точность, которую важно учитывать в ответе.','Точность зависит от прибора, способа измерения и условий. Цена деления — значение одного деления шкалы. Результат не следует записывать с заведомо лишними знаками. Большие и малые числа удобно представлять в стандартном виде a·10ⁿ, где 1 ≤ a < 10.','Округляй результат до разряда, который оправдан исходными данными. Приближённое значение отмечают знаком ≈.','Например, 3 500 000 = 3,5·10⁶; 0,00042 = 4,2·10⁻⁴.','Как записать 0,00042 в стандартном виде?',['4,2·10⁻⁴','42·10⁻⁴','4,2·10⁴'],0,'Запятая переносится на 4 позиции вправо, поэтому степень равна −4.','Посчитай, на сколько разрядов нужно передвинуть запятую, чтобы получить число от 1 до 10.']
]],
['Механическое движение','Описываем движение относительно выбранного тела и учимся читать его характеристики.','🚲','#149b9a',[
['Механическое движение и его характеристики. Система отсчёта','Движение описывают, указывая, как меняется положение тела со временем.','Механическое движение — изменение положения тела относительно других тел с течением времени. Траектория — линия движения; путь — длина траектории; перемещение — направленный отрезок от начального положения к конечному. Система отсчёта включает тело отсчёта, связанную с ним систему координат и часы.','Путь зависит от траектории; перемещение задаёт изменение положения. Для прямого движения без смены направления их модули совпадают.','Чтобы описать движение пассажира, можно выбрать вагон или Землю как тело отсчёта.','Что входит в систему отсчёта?',['Тело отсчёта, координатная система и часы','Только движущееся тело','Только линейка'],0,'Для описания положения и его изменения нужны тело отсчёта, координаты и измерение времени.','Подумай, относительно чего и когда мы определяем положение тела.']
]],
['Механическое движение','Одно и то же тело может покоиться относительно одного объекта и двигаться относительно другого.','🔁','#149b9a',[
['Относительность механического движения','Покой и движение зависят от выбранной системы отсчёта.','Пассажир, сидящий в движущемся автобусе, покоится относительно автобуса, но движется относительно дороги. Поэтому перед описанием движения указывают тело отсчёта. Координаты и траектория также могут зависеть от выбранной системы.','Нельзя говорить о движении или покое без указания, относительно чего оно рассматривается.','Капли дождя движутся относительно автобуса и имеют другую траекторию относительно Земли.','Пассажир сидит в поезде. Относительно чего он покоится?',['Относительно вагона','Относительно станции','Относительно рельсов'],0,'Если пассажир не меняет положения относительно вагона, он покоится относительно вагона.','Выбери объект, положение пассажира относительно которого не меняется.']
]],
['Механическое движение','Различаем равномерное и неравномерное движение по изменению пути за равные промежутки времени.','📈','#149b9a',[
['Прямолинейное равномерное и неравномерное движение','Характер движения показывает, одинаково ли тело проходит путь за одинаковое время.','При равномерном движении по прямой тело за любые равные промежутки времени проходит равные пути. При неравномерном движении за равные промежутки проходят разные пути. В повседневных ситуациях скорость часто меняется, поэтому движение неравномерное.','Равномерность проверяют сравнением путей за равные интервалы времени. Направление прямолинейного движения остаётся на одной линии.','Если за каждую секунду велосипедист проходит 4 м, его движение равномерно.','Тело за каждую секунду проходит всё больший путь. Как движется тело?',['Неравномерно','Равномерно','Оно покоится'],0,'За равные интервалы времени пройдены разные пути, следовательно движение неравномерное.','Сравни путь именно за одинаковые промежутки времени.']
]],
['Механическое движение','Вычисляем скорость и среднюю скорость, следим за единицами и переводом величин.','⏱️','#149b9a',[
['Расчёт скорости и средней скорости','Скорость связывает пройденный путь со временем движения.','При равномерном движении скорость равна отношению пути ко времени: v=s/t. Отсюда s=vt, t=s/v. Средняя скорость на всём пути равна полному пути, делённому на полное время движения. Для перевода: 1 м/с = 3,6 км/ч.','v — скорость (м/с или км/ч), s — путь (м или км), t — время (с или ч). Единицы пути и времени должны быть согласованы.','За 20 с тело прошло 120 м: v=120/20=6 м/с.','Тело прошло 120 м за 20 с. Чему равна скорость?',['6 м/с','0,6 м/с','2400 м/с'],0,'v=s/t=120/20=6 м/с.','Раздели весь путь на время и проверь единицу м/с.']
]],
['Механическое движение','Графики помогают видеть, как меняются координата и путь во времени.','📉','#149b9a',[
['Графическое представление различных видов механического движения','На графике движение можно сравнить без длинного описания словами.','График пути s(t) показывает, какой путь пройден к каждому моменту времени. Для равномерного движения график пути — прямая, выходящая из начала координат, а её наклон связан со скоростью: чем линия круче, тем скорость больше. На графике координаты x(t) направление отражается ростом или убыванием координаты.','Читайте подписи и единицы осей. Скорость на графике s(t) равна отношению изменения пути к изменению времени.','Горизонтальный участок графика s(t) означает, что путь не меняется: тело покоится.','Что показывает горизонтальный участок графика пути от времени?',['Путь не меняется, тело покоится','Скорость постоянно растёт','Тело ускоряется'],0,'При постоянном времени путь остаётся тем же, значит тело не движется.','Посмотри, меняется ли значение s при увеличении t.']
]],
['Плотность','Измеряем массу и объём, затем сравниваем вещества по плотности.','⚖️','#ed8b32',[
['Масса и измерение массы тел','Масса характеризует инертность тела и измеряется в килограммах.','Массу измеряют весами, сравнивая тело с гирями или используя электронные весы. Перед измерением проверяют нулевое положение и выбирают подходящий предел измерения. В СИ масса выражается в килограммах; 1 кг = 1000 г.','Масса — скалярная величина. Не смешивай массу (кг) с весом (сила, Н).','При взвешивании на чашечных весах равновесие достигается, когда массы уравновешены.','Какой прибор используют для измерения массы?',['Весы','Секундомер','Динамометр'],0,'Массу измеряют весами; динамометр измеряет силу.','Сопоставь прибор с измеряемой величиной.']
]],
['Плотность','Для тел сложной формы объём можно найти по вытесненной жидкости.','🧪','#ed8b32',[
['Измерение объёма тел правильной и неправильной формы','Объём показывает, какое пространство занимает тело.','Объём правильного тела рассчитывают по его размерам (например, прямоугольный брусок: V=abc). Объём жидкости измеряют мензуркой. Объём тела неправильной формы определяют погружением в жидкость: Vтела=Vпосле−Vдо.','Основная единица объёма в СИ — м³; часто используют дм³, см³ и л. 1 л = 1 дм³; 1 см³ = 1 мл.','Если уровень воды вырос с 40 мл до 57 мл, объём погружённого тела равен 17 мл = 17 см³.','Как найти объём камня неправильной формы?',['По увеличению объёма жидкости в мензурке','Измерить только его длину','Взвесить его'],0,'Разность конечного и начального объёмов равна объёму вытесненной жидкости.','Нужно сравнить показания мензурки до и после погружения.']
]],
['Плотность','Плотность позволяет сравнивать вещества, учитывая одновременно массу и объём.','🧊','#ed8b32',[
['Плотность вещества и единицы измерения плотности','Плотность показывает массу вещества в единице объёма.','Плотность ρ=m/V. Для однородного вещества при одинаковых условиях отношение массы к объёму постоянно. Единицы: кг/м³ и г/см³; 1 г/см³=1000 кг/м³. По плотности и объёму можно найти массу: m=ρV; по массе и плотности — объём: V=m/ρ.','ρ — плотность; m — масса; V — объём. Не смешивай единицы при подстановке в формулу.','При ρ=2 г/см³ и V=5 см³ масса m=10 г.','Масса тела 200 г, объём 100 см³. Какова плотность?',['2 г/см³','0,5 г/см³','20 000 г/см³'],0,'ρ=m/V=200/100=2 г/см³.','Раздели массу на объём, сохранив согласованные единицы.']
]],
['Взаимодействие тел','Исследуем инерцию, силы, деформации и их совместное действие.','🧲','#e35b67',[
['Явление инерции','Тела не меняют скорость мгновенно без взаимодействия с другими телами.','Инерция — явление сохранения скорости тела, когда действие других тел отсутствует или скомпенсировано. При резком торможении пассажир продолжает движение вперёд; ремень безопасности помогает изменить его движение вместе с автомобилем. Инертность характеризуется массой.','Чем больше масса тела, тем труднее изменить его скорость при взаимодействии. Инерция — явление, масса — мера инертности.','При вытягивании карточки из-под монеты монета из-за инерции падает в стакан.','Почему при резком торможении пассажир наклоняется вперёд?',['Из-за инерции тело стремится сохранить прежнюю скорость','Из-за уменьшения массы','Из-за исчезновения силы тяжести'],0,'Тело пассажира продолжает движение, пока взаимодействие не изменит его скорость.','Вспомни, стремится ли движущееся тело сразу остановиться.']
]],
['Взаимодействие тел','Сила описывает действие одного тела на другое и может менять движение или форму.','➡️','#e35b67',[
['Сила','Силой характеризуют взаимодействие тел.','Сила — векторная физическая величина. Она может изменить скорость тела или вызвать деформацию. Сила имеет модуль, направление и точку приложения. Единица СИ — ньютон (Н). Силу измеряют динамометром.','На рисунках силу изображают стрелкой: длина соответствует модулю в выбранном масштабе, направление стрелки — направлению силы.','Одинаково направленные силы на одном теле усиливают действие друг друга.','Каким прибором измеряют силу?',['Динамометром','Весами','Мензуркой'],0,'Динамометр предназначен для измерения силы.','Ищи прибор с пружиной и шкалой силы.']
]],
['Взаимодействие тел','Различаем всемирное тяготение, силу тяжести и вес тела.','🌍','#e35b67',[
['Явление тяготения и сила тяжести. Вес','Земля притягивает тела, а опора или подвес взаимодействуют с телом.','Всемирное тяготение — взаимное притяжение тел. Сила тяжести — сила, с которой Земля притягивает тело; у поверхности Земли Fтяж≈mg, где g≈9,8 Н/кг (в школьных расчётах часто 10 Н/кг). Вес — сила, с которой тело вследствие притяжения действует на опору или подвес. В покое на горизонтальной опоре вес по модулю равен mg.','Сила тяжести приложена к телу; вес приложен к опоре или подвесу. Их не следует отождествлять.','Для m=2 кг сила тяжести около 20 Н при g≈10 Н/кг.','Как называется сила, с которой Земля притягивает тело?',['Сила тяжести','Сила трения','Вес тела'],0,'Силу притяжения Землёй называют силой тяжести.','Отличай силу, действующую на тело, от действия тела на опору.']
]],
['Взаимодействие тел','Изменение формы или размеров тела под действием сил называется деформацией.','🌀','#e35b67',[
['Деформация','Деформации бывают обратимыми и необратимыми.','Деформация — изменение формы или размеров тела при взаимодействии с другими телами. При упругой деформации после прекращения действия силы тело восстанавливает первоначальную форму; пластическая сохраняется. Деформации могут быть растяжением, сжатием, изгибом, кручением и сдвигом.','Деформация возникает при действии силы. Реальное тело может одновременно испытывать несколько видов деформации.','Пружина после снятия небольшой нагрузки возвращается к исходной длине; пластилин сохраняет новую форму.','Какую деформацию называют упругой?',['Тело восстанавливает форму после прекращения действия силы','Форма остаётся изменённой','Тело обязательно разрушается'],0,'Упругая деформация исчезает после снятия нагрузки.','Подумай, что происходит с телом, когда силу убирают.']
]],
['Взаимодействие тел','Пружина растягивается тем сильнее, чем больше приложенная сила (в пределах упругости).','🪀','#e35b67',[
['Сила упругости, закон Гука','При упругой деформации возникает сила, направленная против деформации.','Сила упругости появляется при деформации и стремится вернуть тело в исходное состояние. Для пружины при небольших деформациях закон Гука: Fупр=kx, где x — удлинение или сжатие, k — жёсткость пружины. В СИ k выражают в Н/м, x — в м.','Закон Гука применим в пределах упругой деформации. Чем больше k, тем труднее растянуть пружину на одинаковую длину.','При k=100 Н/м и x=0,02 м сила упругости равна 2 Н.','Как направлена сила упругости растянутой пружины?',['Против направления растяжения','В направлении растяжения','Всегда вертикально вниз'],0,'Сила упругости противодействует деформации.','Она стремится вернуть пружину к первоначальной длине.']
]],
['Взаимодействие тел','Трение может мешать движению или помогать ему — всё зависит от ситуации.','🛞','#e35b67',[
['Сила трения. Учёт трения в технике','Сила трения возникает при соприкосновении поверхностей и препятствует их относительному движению.','Различают трение покоя, скольжения и качения. Трение зависит от свойств и состояния поверхностей и силы прижатия. Его уменьшают смазкой, подшипниками и полировкой; увеличивают, например, протектором и шероховатостью там, где нужно сцепление.','Трение покоя удерживает предмет от начала скольжения; трение качения обычно меньше трения скольжения.','Без трения обуви о землю человек не смог бы оттолкнуться при ходьбе.','Как можно уменьшить трение в подвижном механизме?',['Использовать смазку','Сделать поверхности более шероховатыми','Увеличить силу прижатия'],0,'Смазка уменьшает непосредственное взаимодействие поверхностей и снижает трение.','Вспомни, что делают с цепью или механизмом, чтобы он двигался легче.']
]],
['Взаимодействие тел','Равнодействующая показывает совместное действие нескольких сил на одной прямой.','➕','#e35b67',[
['Сложение сил, действующих на тело вдоль одной прямой','Несколько сил можно заменить одной равнодействующей силой.','Если силы направлены одинаково, их равнодействующая равна сумме модулей. Если силы направлены противоположно, модуль равнодействующей равен разности модулей, направление — направление большей силы. При равных противоположных силах равнодействующая равна нулю.','Силы складывают как векторы. Равнодействующая R описывает их общее действие.','На тело действуют силы 8 Н вправо и 3 Н влево: R=5 Н вправо.','На тело действуют 8 Н вправо и 3 Н влево. Чему равна равнодействующая?',['5 Н вправо','11 Н влево','0 Н'],0,'Противоположно направленные силы вычитают: 8−3=5 Н; направление — большей силы.','Вычти меньшую силу из большей и оставь направление большей.']
]],
['Давление','Объясняем давление через строение вещества и взаимодействие частиц.','🫧','#299bce',[
['Молекулярное строение твёрдых тел, жидкостей и газов','Все вещества состоят из частиц, которые непрерывно движутся и взаимодействуют.','В твёрдых телах частицы расположены близко и колеблются около положений равновесия; тело сохраняет форму и объём. В жидкости частицы близки, но могут перемещаться; жидкость сохраняет объём и принимает форму сосуда. В газе частицы далеко друг от друга и движутся свободно; газ занимает весь сосуд.','Диффузия — взаимное проникновение частиц соприкасающихся веществ. Она быстрее идёт при повышении температуры.','Давление газа возникает из-за ударов его частиц о стенки сосуда.','Как расположены частицы газа по сравнению с частицами жидкости?',['В среднем дальше друг от друга','Плотно и неподвижно','В строго упорядоченной решётке'],0,'Частицы газа находятся значительно дальше друг от друга и свободнее движутся.','Сравни расстояния между частицами в трёх состояниях вещества.']
]],
['Давление','Площадь соприкосновения влияет на давление твёрдого тела на поверхность.','📌','#299bce',[
['Давление твёрдых тел','Давление показывает, как сила распределяется по площади опоры.','Давление p равно отношению перпендикулярной поверхности силы F к площади S: p=F/S. Единица СИ — паскаль: 1 Па=1 Н/м². При той же силе увеличение площади уменьшает давление; уменьшение площади его увеличивает.','В формуле p=F/S площадь берут в м², силу — в Н, тогда давление получится в Па.','Широкие лыжи уменьшают давление на снег; острое лезвие повышает давление на малой площади.','Сила 200 Н действует на площадь 0,5 м². Найди давление.',['400 Па','100 Па','0,0025 Па'],0,'p=F/S=200/0,5=400 Па.','Раздели силу на площадь в квадратных метрах.']
]],
['Давление','Давление в покоящейся жидкости растёт с глубиной и передаётся газами и жидкостями.','💧','#299bce',[
['Давление в жидкостях и газах, закон Паскаля','Жидкости и газы передают давление во все стороны.','На глубине h давление столба жидкости p=ρgh (гидростатическое давление), где ρ — плотность жидкости, g — ускорение свободного падения. Закон Паскаля: давление, производимое на жидкость или газ, передаётся без изменения каждой точке жидкости или газа и стенкам сосуда.','Чем больше глубина и плотность жидкости, тем больше давление столба. Давление газа связано с ударами его частиц о стенки.','На одной глубине в одной и той же покоящейся жидкости давление одинаково.','Как меняется давление жидкости при увеличении глубины?',['Увеличивается','Уменьшается','Не зависит от глубины'],0,'Над точкой находится более высокий столб жидкости, поэтому p=ρgh больше.','Сравни высоту столба жидкости над точкой.']
]],
['Давление','В сообщающихся сосудах жидкость устанавливается на одном уровне при одинаковом внешнем давлении.','🫗','#299bce',[
['Сообщающиеся сосуды','Сосуды, соединённые нижней частью, образуют общую систему для жидкости.','В сообщающихся сосудах однородная жидкость в покое устанавливается на одинаковой высоте, если на свободные поверхности действует одинаковое давление. Для разных несмешивающихся жидкостей высоты столбов связаны с их плотностями: более плотная жидкость образует меньший столб при равновесии.','Принцип используют в водопроводе, шлюзах и строительных уровнях.','Форма сосудов не меняет уровень одной и той же жидкости в покое.','В двух сообщающихся коленах находится одна и та же жидкость. Как установятся уровни?',['На одинаковой высоте','В узком колене выше','Зависят только от формы колен'],0,'При равновесии давление на одном уровне одинаково; для одной жидкости уровни совпадут.','Представь, что сосуды соединены снизу и жидкость может свободно перетекать.']
]],
['Давление','Гидравлическая машина передаёт давление жидкости и позволяет получить большую силу.','⚙️','#299bce',[
['Гидравлическая машина','Малой силой на малом поршне можно уравновесить большую силу на большом поршне.','По закону Паскаля давления в жидкости равны: F₁/S₁=F₂/S₂. Поэтому F₂/F₁=S₂/S₁. Выигрыш в силе равен отношению площадей поршней. В идеальной машине выигрыш в силе сопровождается проигрышем в расстоянии: меньший поршень проходит больший путь.','Гидравлический пресс и тормоз используют передачу давления жидкостью. Реальная машина имеет потери.','Если площадь второго поршня в 5 раз больше, сила на нём в идеальной модели в 5 раз больше.','Площадь большого поршня в 4 раза больше. Во сколько раз больше уравновешивающая сила?',['В 4 раза','В 2 раза','Не меняется'],0,'При одинаковом давлении сила пропорциональна площади поршня.','Используй F/S одинаковое для обоих поршней.']
]],
['Давление','Атмосфера оказывает давление на тела; его измеряют специальными приборами.','🌤️','#299bce',[
['Атмосферное давление, измерение атмосферного давления','Воздух имеет массу, поэтому столб атмосферы давит на поверхность Земли.','Атмосферное давление создаётся весом воздуха и ударами его частиц. Его измеряют барометром. Нормальное атмосферное давление у уровня моря приблизительно 101 325 Па (760 мм рт. ст.). С высотой давление обычно уменьшается.','В опыте Торричелли атмосферное давление уравновешивает столб ртути. Погодный барометр показывает изменения давления воздуха.','Питьевая трубочка работает потому, что при понижении давления во рту атмосферное давление поднимает жидкость.','Каким прибором измеряют атмосферное давление?',['Барометром','Манометром для любого газа','Динамометром'],0,'Атмосферное давление измеряют барометром.','Вспомни название прибора для давления окружающего воздуха.']
]],
['Давление','Манометры измеряют давление жидкости или газа, насосы перемещают среду и меняют давление.','🧰','#299bce',[
['Манометры, насосы','Приборы давления помогают контролировать жидкости и газы в сосудах и системах.','Манометр измеряет давление жидкости или газа. В простом жидкостном манометре разность уровней столбов связана с разностью давлений. Насос создаёт разность давлений, благодаря которой жидкость или газ перемещается. Устройство насоса может включать клапаны, пропускающие поток в нужном направлении.','Барометр измеряет атмосферное давление; манометр — давление в замкнутой системе или разность давлений.','Насос подаёт воду, создавая давление, которое перемещает её по трубам.','Для чего служит манометр?',['Для измерения давления жидкости или газа','Для измерения массы','Для измерения температуры'],0,'Манометр — прибор для измерения давления.','Не путай его с барометром и термометром.']
]],
['Давление','На погружённое тело жидкость или газ действуют выталкивающей силой.','🛟','#299bce',[
['Выталкивающая сила','Давление жидкости снизу на тело обычно больше, чем сверху, и возникает результирующая сила вверх.','Выталкивающая сила Архимеда равна весу вытесненной жидкости или газа: Fₐ=ρжgVпогр. Она направлена вертикально вверх. Здесь ρж — плотность среды, Vпогр — объём погружённой части тела. Сила действует на тело, помещённое в жидкость или газ.','Сила Архимеда зависит от плотности среды и объёма погружённой части, а не напрямую от глубины для несжимаемой жидкости.','Выталкивающая сила объясняет уменьшение показания динамометра при погружении груза в воду.','От чего зависит архимедова сила в жидкости?',['От плотности жидкости и объёма погружённой части','Только от цвета тела','Только от глубины погружения'],0,'Fₐ=ρжgVпогр; влияют плотность среды и объём вытесненной жидкости.','Вспомни формулу силы Архимеда.']
]],
['Давление','Плавание определяется соотношением силы тяжести и выталкивающей силы.','🚢','#299bce',[
['Условия плавания тел','Тело тонет, всплывает или плавает в зависимости от сил и плотностей.','Если сила тяжести больше выталкивающей силы, тело опускается; если меньше — поднимается. При равновесии силы равны. Для однородного тела сравнение плотностей даёт удобный критерий: при ρтела>ρж тело тонет; при ρтела<ρж плавает у поверхности; равные плотности соответствуют нейтральному равновесию в толще жидкости.','Плавающее тело вытесняет жидкость, вес которой равен весу тела. Полые корпуса судов имеют среднюю плотность меньше плотности воды.','Стальной корабль плавает благодаря большому объёму корпуса с воздухом и вытеснению воды.','Когда однородное тело тонет в жидкости?',['Когда его плотность больше плотности жидкости','Когда плотности равны','Когда его объём большой'],0,'Если плотность тела больше плотности жидкости, его вес превышает выталкивающую силу при полном погружении.','Сравни плотность тела с плотностью жидкости.']

['Работа и мощность. Энергия','Измеряем механическую работу и сравниваем скорость выполнения работы.','💪','#e4a821',[
['Механическая работа. Мощность','Работа совершается, когда сила вызывает перемещение тела.','При постоянной силе, направленной вдоль перемещения, A=Fs. Единица работы — джоуль: 1 Дж=1 Н·м. Мощность N=A/t показывает работу за единицу времени; единица — ватт (Вт), 1 Вт=1 Дж/с.','Если перемещения нет, механическая работа силы равна нулю. Учитывай направление силы относительно перемещения.','Подъём груза силой 20 Н на 3 м требует работы 60 Дж.','Сила 20 Н перемещает тело на 3 м вдоль направления силы. Какова работа?',['60 Дж','23 Дж','6,7 Дж'],0,'A=Fs=20·3=60 Дж.','Умножь силу на путь вдоль её направления.']

['Работа и мощность. Энергия','Энергия характеризует способность тела совершать работу и зависит от состояния системы.','⚡','#e4a821',[
['Кинетическая энергия. Потенциальная энергия','Движущееся тело имеет кинетическую энергию, а взаимодействующие тела могут иметь потенциальную.','Кинетическая энергия тела массой m со скоростью v: Eк=mv²/2. Потенциальная энергия тела массой m на высоте h у поверхности Земли: Eп=mgh. Потенциальную энергию также имеет деформированная пружина. Единица энергии — джоуль.','Кинетическая энергия растёт с массой и квадратом скорости; потенциальная — с высотой относительно выбранного уровня.','Удвоение скорости при той же массе увеличивает кинетическую энергию в 4 раза.','Какая энергия есть у движущегося мяча?',['Кинетическая','Только потенциальная','Нет энергии'],0,'Кинетическая энергия связана с движением тела.','Слово происходит от понятия движения.']

['Работа и мощность. Энергия','В замкнутой системе энергия превращается из одного вида в другой, сохраняясь.','🔄','#e4a821',[
['Превращение и сохранение энергии','При движении энергия может менять вид, но общий баланс позволяет описывать процесс.','При падении тела потенциальная энергия уменьшается, а кинетическая растёт. В идеальном случае без потерь их сумма остаётся постоянной: Eк+Eп=const. В реальных процессах часть механической энергии переходит во внутреннюю энергию из-за трения и сопротивления. Закон сохранения энергии применим к полной энергии системы.','Энергия не исчезает бесследно: она передаётся телам или преобразуется в другие виды. Учитывай границы системы и потери механической энергии.','Маятник обменивает кинетическую и потенциальную энергию; у крайних положений больше потенциальная, внизу — кинетическая.','Что происходит с потенциальной энергией падающего тела?',['Она превращается в кинетическую','Исчезает без следа','Всегда остаётся неизменной'],0,'При падении высота уменьшается, а скорость растёт: потенциальная энергия превращается в кинетическую.','Сравни высоту и скорость тела до и после падения.']

['Момент силы','Изучаем простые механизмы, равновесие и эффективность их применения.','⚖️','#eb6542',[
['Простые механизмы','Простые механизмы помогают изменить величину или направление силы.','Рычаг, блок, наклонная плоскость, ворот и клин — примеры простых механизмов. В идеальном механизме выигрыш в силе сопровождается проигрышем в расстоянии; работа не уменьшается. Механизм помогает приспособить действие силы, но не создаёт энергию.','Подвижный блок может уменьшить силу, необходимую для подъёма груза, но верёвку придётся вытянуть на больший путь.','Пандус уменьшает силу подъёма груза, увеличивая путь его перемещения.','Что обычно сопровождает выигрыш в силе в идеальном механизме?',['Проигрыш в расстоянии','Выигрыш в работе','Исчезновение трения'],0,'Идеальный механизм перераспределяет силу и путь, сохраняя работу.','Сравни произведение силы на путь до и после механизма.']

['Момент силы','Положение центра масс помогает понять устойчивость тела.','🎯','#eb6542',[
['Центр масс тел','Движение тела можно описывать через особую точку — центр масс.','Центр масс системы движется так, как двигалась бы точка, в которой условно сосредоточена масса системы, под действием равнодействующей внешних сил. Для однородного симметричного тела центр масс совпадает с геометрическим центром. Устойчивость повышается, когда центр масс ниже, а площадь опоры больше.','Для устойчивого равновесия вертикаль через центр масс должна проходить внутри площади опоры.','Широкая постановка ног увеличивает площадь опоры и помогает сохранять равновесие.','Что обычно повышает устойчивость тела?',['Более низкий центр масс и широкая опора','Высокий центр масс и узкая опора','Уменьшение площади опоры'],0,'Низкое положение центра масс и большая площадь опоры затрудняют опрокидывание.','Подумай, как устроена устойчивость низкой широкой фигуры.']

['Момент силы','Рычаг находится в равновесии, когда вращательные действия сил уравновешены.','🔧','#eb6542',[
['Условие равновесия рычага','Плечо силы и величина силы определяют, насколько сильно она поворачивает рычаг.','Плечо силы — кратчайшее расстояние от оси вращения до линии действия силы. Момент силы M=Fl, где F — сила, l — плечо. Условие равновесия рычага: моменты сил, вращающих его в противоположных направлениях, равны: F₁l₁=F₂l₂.','Для равновесия важны одновременно сила и её плечо. Единица момента — Н·м.','Силой 10 Н на плече 0,4 м уравновешивается сила 20 Н на плече 0,2 м.','Какое условие необходимо для равновесия рычага?',['Моменты противоположно вращающих сил равны','Силы всегда должны быть равны','Оба плеча должны быть нулевыми'],0,'Равновесие наступает, когда произведения силы на плечо с обеих сторон равны.','Сравни не только силы, но и их плечи.']

['Момент силы','КПД показывает, какая доля затраченной работы стала полезной.','♻️','#eb6542',[
['Коэффициент полезного действия (КПД)','В реальном механизме часть энергии расходуется на преодоление трения и другие потери.','КПД η равен отношению полезной работы к затраченной: η=Aпол/Aзат·100%. Он не превышает 100% для обычного механизма. Чем меньше потери, тем выше КПД. При подъёме груза полезная работа связана с увеличением его потенциальной энергии.','Работа и КПД должны относиться к одному процессу и выражаться в одинаковых единицах.','Если полезная работа 80 Дж, а затраченная 100 Дж, КПД равен 80%.','Полезная работа 80 Дж при затраченной 100 Дж. Чему равен КПД?',['80%','20%','125%'],0,'η=80/100·100%=80%.','Раздели полезную работу на затраченную и умножь на 100%.']

['Космос и Земля','Знакомимся с небесными телами и наблюдательной астрономией.','🔭','#545fd0',[
['Наука о небесных телах','Астрономия исследует небесные тела, их движение и строение Вселенной.','Астрономия изучает Солнце, планеты, звёзды, спутники, кометы и другие небесные тела. Наблюдения проводят невооружённым глазом и с помощью телескопов; измерительные приборы позволяют получать сведения о далёких объектах. Наблюдаемое явление объясняют и проверяют новыми данными.','Звезда излучает собственный свет; планета видна главным образом благодаря отражённому свету звезды.','Солнце — ближайшая к Земле звезда и источник света и тепла для Земли.','Какая наука изучает небесные тела?',['Астрономия','Геология','Биология'],0,'Астрономия изучает небесные тела и Вселенную.','Выбери название науки о космических объектах.']

['Космос и Земля','Солнечная система включает Солнце и тела, связанные его притяжением.','🪐','#545fd0',[
['Солнечная система','Планеты обращаются вокруг Солнца, а спутники — вокруг планет.','Солнечная система состоит из Солнца, восьми планет и множества малых тел: карликовых планет, астероидов, комет и метеороидов. Планеты земной группы — Меркурий, Венера, Земля, Марс; планеты-гиганты — Юпитер, Сатурн, Уран, Нептун. Земля имеет естественный спутник — Луну.','Планеты не излучают собственного видимого света, а отражают солнечный. Орбиты планет близки к плоскости эклиптики.','В порядке от Солнца Земля третья планета, между Венерой и Марсом.','Какая планета является естественным спутником Земли?',['Луна','Марс','Венера'],0,'Луна — естественный спутник Земли.','Вспомни ближайшее к Земле небесное тело, обращающееся вокруг неё.']

['Космос и Земля','Календарь согласует счёт дней с периодическим движением Земли и Луны.','📅','#545fd0',[
['Основы календаря','Календарь позволяет упорядочить дни, месяцы и годы.','Сутки связаны с вращением Земли вокруг оси, год — с обращением Земли вокруг Солнца. Лунный месяц связан с повторением фаз Луны и длится примерно 29,5 суток, поэтому календарные месяцы имеют разную длину. Тропический год немного длиннее 365 суток; в григорианском календаре високосные годы помогают согласовать календарь с сезонами.','Обычный год содержит 365 дней; високосный — 366. В високосный год в феврале 29 дней.','Добавление дополнительного дня компенсирует дробную часть продолжительности года.','С каким движением Земли связана смена дня и ночи?',['Вращением вокруг оси','Обращением вокруг Солнца','Движением Луны вокруг Земли'],0,'Смена дня и ночи связана с суточным вращением Земли вокруг оси.','Отдели суточное вращение от годового обращения.']

const KEYS={users:'eureka_users_v1',session:'eureka_session_v1',results:'eureka_results_v2',surveys:'eureka_survey_v1',attempts:'eureka_attempts_v3',surveysV3:'eureka_survey_v3'};

const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function read(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}} function write(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function users(){return read(KEYS.users,{})} function current(){const x=read(KEYS.session,null);return x?.email?users()[x.email]||null:null}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return 'h'+(h>>>0).toString(36)}
function allAttempts(){return read(KEYS.attempts,[])} function saveAttempt(a){const arr=allAttempts();arr.push(a);write(KEYS.attempts,arr); const legacy=read(KEYS.results,{});(legacy[a.source]??=[]).push({...a,percent:a.percent,score10:Math.round(a.percent/10)});write(KEYS.results,legacy)}
function goto(view,extra={}){state={...state,view,...extra};state.review=false;state.answers={};state.feedback={};state.answerRecords={};if(view==='lesson'){const id='p'+(CHAPTERS[state.chapter][5]+state.lesson);state.savedAnswers={...(state.savedAnswers||{})};delete state.savedAnswers[id+'-q1']}render();scrollTo({top:0,behavior:'smooth'})}

function doLogin(){const email=($('#loginEmail')?.value||'').trim().toLowerCase(),pass=$('#loginPass')?.value||'',u=users()[email];if(!u||u.passHash!==hash(pass)){state.authError='Неверная почта или пароль.';render();return}write(KEYS.session,{email});state.authError='';state.view='home';render()}
function doRegister(){const name=($('#regName')?.value||'').trim(),email=($('#regEmail')?.value||'').trim().toLowerCase(),pass=$('#regPass')?.value||'',role=state.role;let cls=$('#regClass')?.value||'';if(!name||!email||!pass||!email.includes('@')){state.authError='Проверь имя, почту и пароль.';render();return}if(pass.length<4){state.authError='Пароль должен быть не короче 4 символов.';render();return}if(role==='student'&&!cls){state.authError='Выбери свой класс.';render();return}if(role==='teacher'&&($('#regTeacherCode')?.value||'').trim()!==TEACHER_CODE){state.authError='Неверный код доступа учителя.';render();return}const u=users();if(u[email]){state.authError='Эта почта уже зарегистрирована.';render();return}u[email]={name,email,passHash:hash(pass),role,className:cls||null};write(KEYS.users,u);write(KEYS.session,{email});state.authError='';state.view='home';render()}
function auth(){return `<main class="auth"><section class="auth-card"><div class="brand"><i>Э</i><b>Эврика!</b></div><p class="eyebrow">ИНТЕРАКТИВНЫЙ КУРС · ФИЗИКА · 7 КЛАСС</p><h1>${state.authMode==='login'?'С возвращением!':'Создать аккаунт'}</h1><p class="muted">Войдите, чтобы сохранять ход изучения и ответы.</p>${state.authError?`<div class="error">${esc(state.authError)}</div>`:''}${state.authMode==='login'?`<label>Электронная почта<input id="loginEmail" type="email" autocomplete="username"></label><label>Пароль<input id="loginPass" type="password" autocomplete="current-password"></label><button class="btn primary full" onclick="doLogin()">Войти →</button><p class="switch">Нет аккаунта? <a onclick="state.authMode='register';state.authError='';render()">Зарегистрироваться</a></p>`:`<label>Имя и фамилия<input id="regName" maxlength="60"></label><label>Электронная почта<input id="regEmail" type="email"></label><label>Пароль (от 4 символов)<input id="regPass" type="password"></label><div class="role-toggle"><button class="${state.role==='student'?'selected':''}" onclick="state.role='student';render()">🎓 Ученик</button><button class="${state.role==='teacher'?'selected':''}" onclick="state.role='teacher';render()">🧑‍🏫 Учитель</button></div>${state.role==='student'?`<label>Класс<select id="regClass"><option value="">Выбери класс</option>${CLASS_OPTIONS.map(c=>`<option>${c}</option>`).join('')}</select></label>`:`<label>Код доступа учителя<input id="regTeacherCode"></label><small>Демо-код: <b>${TEACHER_CODE}</b></small>`}<button class="btn primary full" onclick="doRegister()">Зарегистрироваться →</button><p class="switch">Уже есть аккаунт? <a onclick="state.authMode='login';state.authError='';render()">Войти</a></p>`}</section><aside class="auth-art"><span>F = ma</span><b>Мир объясним.<br>Начнём с вопроса.</b><div>✦　→　◌　∿</div></aside></main>`}
function progress(){const mine=allAttempts().filter(a=>a.email===current()?.email);return mine}
function bestFor(key){const a=progress().filter(x=>x.source===key);return a.length?Math.max(...a.map(x=>x.percent)):null}

function eurekaCrosswordGrid(n){const source=EUREKA_CROSSWORDS[n];if(!source)return '';const size=17,grid=Array.from({length:size},()=>Array(size).fill(null)),placed=[];function tryPlace(word,clue,index){const w=word.replace(/[^А-ЯЁ]/gi,'').toUpperCase();if(!placed.length){const r=Math.floor(size/2),c=Math.floor((size-w.length)/2);for(let k=0;k<w.length;k++)grid[r][c+k]=w[k];placed.push({word:w,clue,index,r,c,dir:'h',num:1});return true;}for(const p of placed){for(let a=0;a<p.word.length;a++){for(let b=0;b<w.length;b++){if(p.word[a]!==w[b])continue;const dir=p.dir==='h'?'v':'h',r=p.r+(p.dir==='h'?0:a)-(dir==='v'?b:0),c=p.c+(p.dir==='v'?0:a)-(dir==='h'?b:0);if(r<1||c<1||r+(dir==='v'?w.length:1)>=size-1||c+(dir==='h'?w.length:1)>=size-1)continue;let ok=true,intersections=0;for(let k=0;k<w.length;k++){const rr=r+(dir==='v'?k:0),cc=c+(dir==='h'?k:0),old=grid[rr][cc];if(old&&old!==w[k]){ok=false;break;}if(old===w[k])intersections++;else if((dir==='h'&&(grid[rr-1][cc]||grid[rr+1][cc]))||(dir==='v'&&(grid[rr][cc-1]||grid[rr][cc+1]))){ok=false;break;}}const br=r-(dir==='v'?1:0),bc=c-(dir==='h'?1:0),ar=r+(dir==='v'?w.length:0),ac=c+(dir==='h'?w.length:0);if(grid[br]?.[bc]||grid[ar]?.[ac])ok=false;if(!ok||!intersections)continue;for(let k=0;k<w.length;k++)grid[r+(dir==='v'?k:0)][c+(dir==='h'?k:0)]=w[k];placed.push({word:w,clue,index,r,c,dir,num:placed.length+1});return true;}}}return false;}source.forEach((x,i)=>tryPlace(x[0],x[1],i));source.forEach((x,i)=>{if(placed.some(p=>p.index===i))return;const w=x[0].replace(/[^А-ЯЁ]/gi,'').toUpperCase();for(let r=1;r<size-1;r++){const c=1;if(c+w.length>=size-1)continue;let clear=true;for(let k=0;k<w.length;k++)if(grid[r][c+k]||grid[r-1][c+k]||grid[r+1][c+k])clear=false;if(grid[r][c-1]||grid[r][c+w.length])clear=false;if(clear){for(let k=0;k<w.length;k++)grid[r][c+k]=w[k];placed.push({word:w,clue:x[1],index:i,r,c,dir:'h',num:placed.length+1});break;}}});if(placed.length<3)return '';const cells=[];for(let r=0;r<size;r++)for(let c=0;c<si
