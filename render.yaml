databases:
  - name: eureka-db
    plan: basic-256mb
    databaseName: eureka
    user: eureka

services:
  - type: web
    name: eureka-physics-school
    runtime: docker
    plan: starter
    healthCheckPath: /health
    preDeployCommand: npm run migrate
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: eureka-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TEACHER_CODE
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
