databases:
  - name: eureka-db
    plan: free
    databaseName: eureka
    user: eureka

services:
  - type: web
    name: eureka-physics-school
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: eureka-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TEACHER_CODE
        sync: false
